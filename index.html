<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#875664"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Мой день"><title>Мой день — личный трекер</title><style>
:root{--bg:#f6efeb;--card:#fffdfb;--ink:#463b39;--muted:#8c7b76;--rose:#875664;--rose2:#c99aa2;--line:#eadbd5;--green:#719276;--gold:#b08a55;--red:#b66d6d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#faf5f1,#eee3dd);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:780px;margin:auto;padding:10px 13px 55px}header{text-align:center;padding:12px 4px 10px}h1{font:500 34px Georgia,serif;color:#704b55;margin:4px}.sub{font-size:13px;color:var(--muted)}
.sticky{position:sticky;top:0;z-index:20;background:rgba(246,239,235,.94);backdrop-filter:blur(14px);padding:8px 0}.date{width:100%;padding:11px;border:1px solid var(--line);border-radius:14px;background:var(--card);font:inherit;color:var(--ink)}
.summary{background:linear-gradient(135deg,#fffaf7,#f3e6e3);border:1px solid var(--line);border-radius:23px;padding:16px;margin:8px 0 12px}.scoreRow{display:flex;align-items:center;gap:14px}.score{font:500 43px Georgia,serif;color:var(--rose);min-width:82px}.grow{flex:1}
.bar,.meter{background:#eadfd9;border-radius:99px;overflow:hidden}.bar{height:12px}.fill,.meter i{display:block;height:100%;background:linear-gradient(90deg,#b9828b,#769678);border-radius:99px;transition:.3s}.meta{font-size:12px;color:var(--muted);margin-top:7px}
.actions{display:flex;gap:8px;overflow:auto;padding:2px 0 5px}.action{white-space:nowrap;border:0;border-radius:14px;padding:10px 13px;font:inherit;cursor:pointer;background:var(--rose);color:#fff}.secondary{background:#e8dad3;color:#5d4d49}
h2{font:500 22px Georgia,serif;color:#704b55;margin:22px 4px 8px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin:8px 0;box-shadow:0 2px 8px #6b4a3a0b}
.row{display:flex;align-items:center;gap:10px}.title{font-size:15px;font-weight:650;line-height:1.35}.hint{font-size:11px;color:var(--muted);margin-top:4px}.yn{display:flex;gap:7px}.circle{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:#faf5f2;color:var(--muted);font-weight:650}.circle.active{background:var(--rose);border-color:var(--rose);color:#fff}
input,textarea{font:inherit;background:#fffaf7;border:1px solid var(--line);border-radius:12px;color:var(--ink);outline:none}input:focus,textarea:focus{border-color:var(--rose2);box-shadow:0 0 0 3px #c99aa220}.num{width:118px;padding:11px}textarea{width:100%;min-height:76px;padding:11px;margin-top:9px;resize:vertical}.result{font-size:11px;font-weight:700;text-align:right;min-width:92px}.green{color:var(--green)}.gold{color:var(--gold)}.red{color:var(--red)}
.meter{height:7px;margin-top:9px}.meter i{width:0;background:var(--rose2)}.history{display:none}.history.show{display:block}.day{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;margin:7px 0}.empty{text-align:center;color:var(--muted);padding:20px}.statsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{font-size:22px;color:var(--rose)}.stat span{display:block;font-size:11px;color:var(--muted);margin-top:3px}footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0}@media(max-width:520px){.result{min-width:78px}.num{width:105px}.score{font-size:37px}}
</style></head><body><div class="app"><header><h1>Мой день</h1><div class="sub">Мягко. Честно. Без суеты. С любовью к себе.</div></header><div class="sticky"><input class="date" id="date" type="date"></div><div class="summary"><div class="scoreRow"><div class="score" id="score">0%</div><div class="grow"><div class="bar"><div class="fill" id="fill"></div></div><div class="meta" id="meta"></div></div></div></div><div class="actions"><button class="action" onclick="today()">🌷 Сегодня</button><button class="action secondary" onclick="toggleStats()">📊 Статистика</button><button class="action secondary" onclick="exportData()">💾 Экспорт</button><button class="action secondary" onclick="clearDay()">Очистить день</button></div><div id="tracker"></div><div id="history" class="history"></div><footer>Твои записи сохраняются локально в браузере этого устройства.</footer></div><script>
const TOTAL=42,sections=[["🌅 Утро и энергия", [["Утренние ритуалы", "yn"], ["Работа с энергией", "yn"], ["Уход за собой", "yn"], ["Внешность и красота, мои ощущения", "scale", 10], ["Здоровье, мои ощущения", "scale", 10]]], ["🌿 Тело и забота о себе", [["Движение", "range", 10000, "шагов", 5000, 20000], ["Спорт", "yn"], ["Порядок", "yn"], ["Питание", "scale", 10], ["Кофе", "range", 1, "чашек", 0, 3], ["Хлеб и кулинария", "yn"], ["Вода", "range", 1.5, "л", 0.5, 2], ["Паузы для себя", "range", 30, "минут", 15, 60]]], ["💰 Дело, деньги и развитие", [["Работа над доходом", "text"], ["Инвестиции", "yn"], ["Развитие профессионализма", "yn"], ["Обучение и саморазвитие", "yn"], ["Творчество", "yn"]]], ["💗 Я выбираю себя", [["Отдых и бережность к себе", "yn"], ["Работа со своим эмоциональным состоянием, без суеты, в спокойствии", "yn"], ["Дисциплина и саморганизованность", "yn"], ["Проявленность и мои отношения", "yn"], ["Выбирать себя", "yn"], ["Не соглашаться на меньшее", "yn"], ["Мои обещания себе", "yn"], ["Моё пространство меня наполняет?", "yn"], ["Личная жизнь", "yn"], ["Чувство удовлетворения", "yn"]]], ["🌙 Вечер", [["Вечерние ритуалы", "yn"], ["Сон", "range", 8, "часов", 7, 10]]], ["✨ Рефлексия дня", [["Чудеса дня", "text"], ["Мой главный шаг сегодня", "text"], ["Что у меня получилось", "text"], ["Где я выбрала себя", "text"], ["За что я благодарна", "text"], ["Какое моё внутреннее состояние", "text"], ["Что я сегодня сделала для здоровья", "text"], ["Что я сегодня сделала для внешности, ухода и тела", "text"], ["Что я сегодня сделала для финансового роста", "text"], ["Что я сегодня сделала для внутреннего состояния", "text"], ["Что я сегодня сделала для личной жизни и отношений", "text"], ["Что я хочу сделать завтра", "text"]]]],STORE='myDayTracker_v4';let data={};const $=id=>document.getElementById(id);
function iso(){return new Date().toLocaleDateString('en-CA')}function all(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return{}}}function key(s,i){return's'+s+'i'+i}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function load(d){$('date').value=d;data=all()[d]||{};render()}function save(){let a=all();a[$('date').value]=data;localStorage.setItem(STORE,JSON.stringify(a));summary()}
function yn(k,v){data[k]=v;save();render()}function num(k,v,t,type,min,max){data[k]=v===''?'':Number(v);save();metric(k,t,type,min,max)}
function pct(v,t){return Math.max(0,Math.min(100,Number(v)/Number(t)*100))}function status(v,t,min,max){let n=Number(v);if(n<min)return['ниже минимума','red'];if(n<t)return['до нормы','gold'];if(n<=max)return['норма','green'];return['выше максимума','gold']}
function render(){let root=$('tracker');root.innerHTML='';sections.forEach((sec,si)=>{let section=document.createElement('section');section.innerHTML='<h2>'+esc(sec[0])+'</h2>';sec[1].forEach((it,ii)=>{let n=it[0],type=it[1],k=key(si,ii),v=data[k]??'',c=document.createElement('div');c.className='card';
if(type==='yn')c.innerHTML='<div class="row"><div class="grow title">'+esc(n)+'</div><div class="yn"><button class="circle '+(v==='yes'?'active':'')+'" onclick="yn(\''+k+'\',\'yes\')">Да</button><button class="circle '+(v==='no'?'active':'')+'" onclick="yn(\''+k+'\',\'no\')">Нет</button></div></div>';
else if(type==='text')c.innerHTML='<div class="title">'+esc(n)+'</div><textarea placeholder="Напиши здесь…" oninput="data[\''+k+'\']=this.value;save()">'+esc(v)+'</textarea>';
else if(type==='scale'){let p=v!==''?Math.min(100,Number(v)*10):0;c.innerHTML='<div class="row"><div class="grow"><div class="title">'+esc(n)+'</div><div class="hint">Оценка от 0 до 10</div></div><input class="num" type="number" min="0" max="10" step="1" value="'+esc(v)+'" oninput="num(\''+k+'\',this.value,10,\'scale\',0,10)"><div class="result" id="r_'+k+'">'+(v!==''?Math.round(p)+'%':'')+'</div></div><div class="meter"><i id="m_'+k+'" style="width:'+p+'%"></i></div>'}
else{let t=it[2],u=it[3],min=it[4],max=it[5],p=v!==''?pct(v,t):0;c.innerHTML='<div class="row"><div class="grow"><div class="title">'+esc(n)+'</div><div class="hint">Минимум '+min+' · Норма '+t+' · Максимум '+max+' '+u+'</div></div><input class="num" type="number" min="0" step="'+(u==='л'?'.1':'1')+'" value="'+esc(v)+'" oninput="num(\''+k+'\',this.value,'+t+',\'range\','+min+','+max+')"><div class="result" id="r_'+k+'">'+(v!==''?Math.round(p)+'%':'')+'</div></div><div class="meter"><i id="m_'+k+'" style="width:'+p+'%"></i></div>'}section.appendChild(c)});root.appendChild(section)});summary()}
function metric(k,t,type,min,max){let v=data[k],r=$('r_'+k),m=$('m_'+k);if(v===''){if(r)r.textContent='';if(m)m.style.width='0';return}let p=type==='scale'?Math.min(100,Number(v)*10):pct(v,t);if(type==='scale'){r.textContent=Math.round(p)+'%';r.className='result '+(p>=70?'green':p>=40?'gold':'red')}else{let s=status(v,t,min,max);r.textContent=Math.round(p)+'% · '+s[0];r.className='result '+s[1]}if(m)m.style.width=p+'%';summary()}
function summary(){let done=0;sections.forEach((s,si)=>s[1].forEach((it,ii)=>{let v=data[key(si,ii)];if(v!==undefined&&v!=='')done++}));let p=Math.round(done/TOTAL*100);$('score').textContent=p+'%';$('fill').style.width=p+'%';$('meta').textContent=done+' из '+TOTAL+' пунктов заполнено'}
function today(){load(iso());scrollTo({top:0,behavior:'smooth'})}function clearDay(){if(confirm('Очистить все записи за этот день?')){data={};save();render()}}
function stats(){let a=all(),days=Object.keys(a).sort();if(!days.length)return{count:0,avg:0,best:'—',last:'—'};let vals=days.map(d=>{let x=a[d],n=0;sections.forEach((s,si)=>s[1].forEach((it,ii)=>{let v=x[key(si,ii)];if(v!==undefined&&v!=='')n++}));return Math.round(n/TOTAL*100)});return{count:days.length,avg:Math.round(vals.reduce((x,y)=>x+y,0)/vals.length),best:Math.max(...vals)+'%',last:vals[vals.length-1]+'%'}}
function toggleStats(){let b=$('history');b.classList.toggle('show');if(!b.classList.contains('show'))return;let a=all(),days=Object.keys(a).sort().reverse(),s=stats();let out='<h2>📊 Статистика</h2><div class="statsGrid"><div class="stat"><b>'+s.avg+'%</b><span>средний результат</span></div><div class="stat"><b>'+s.best+'</b><span>лучший день</span></div><div class="stat"><b>'+s.count+'</b><span>сохранённых дней</span></div><div class="stat"><b>'+s.last+'</b><span>последний день</span></div></div><h2>📅 По дням</h2>';if(!days.length)out+='<div class="empty">Пока нет сохранённых дней.</div>';days.forEach(d=>{let x=a[d],n=0;sections.forEach((s,si)=>s[1].forEach((it,ii)=>{let v=x[key(si,ii)];if(v!==undefined&&v!=='')n++}));let p=Math.round(n/TOTAL*100);out+='<div class="day"><b>'+d+'</b><div class="meta">'+p+'% · '+n+'/'+TOTAL+' пунктов</div><div class="meter"><i style="width:'+p+'%"></i></div></div>'});b.innerHTML=out}
function exportData(){let blob=new Blob([JSON.stringify(all(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moi-den-dannye.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('date').addEventListener('change',e=>load(e.target.value));load(iso());
</script></body></html>
