<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#875664"><title>Мой день — трекер</title>
<style>
:root{--bg:#f5eee9;--card:#fffdfb;--ink:#493d3b;--muted:#8c7b76;--rose:#875664;--rose2:#c99aa2;--line:#eadbd5;--green:#719276;--gold:#b08a55;--red:#b66d6d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f7f1ed,#eee3dd);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:760px;margin:auto;padding:12px 12px 45px}header{text-align:center;padding:12px 4px 10px}
h1{font:500 32px Georgia,serif;color:#704b55;margin:4px}.sub{font-size:13px;color:var(--muted)}
.sticky{position:sticky;top:0;z-index:10;background:rgba(247,241,237,.94);backdrop-filter:blur(12px);padding:8px 0}
.date{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;width:100%}
.summary{background:linear-gradient(135deg,#fffaf7,#f4e8e5);border:1px solid var(--line);border-radius:22px;padding:16px;margin:8px 0 12px}
.scoreRow{display:flex;align-items:center;gap:15px}.score{font:500 42px Georgia,serif;color:var(--rose);min-width:85px}
.bar{height:12px;background:#eadfd9;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#b9828b,#769678);transition:.3s}
.meta{font-size:12px;color:var(--muted);margin-top:7px}
h2{font:500 21px Georgia,serif;color:#704b55;margin:22px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin:8px 0;box-shadow:0 2px 8px #6b4a3a0b}
.title{font-size:15px;font-weight:600;line-height:1.35}.hint{font-size:11px;color:var(--muted);margin-top:4px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.yn{display:flex;gap:7px}
button{font:inherit;cursor:pointer}.circle{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:#faf5f2;color:var(--muted);font-weight:600}.circle.active{background:var(--rose);border-color:var(--rose);color:white}
input,textarea{font:inherit;background:#fffaf7;border:1px solid var(--line);border-radius:12px;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--rose2);box-shadow:0 0 0 3px #c99aa220}.num{width:120px;padding:11px}
textarea{width:100%;min-height:75px;padding:11px;margin-top:9px;resize:vertical}
.result{font-size:12px;font-weight:700;text-align:right;min-width:100px}.green{color:var(--green)}.gold{color:var(--gold)}.red{color:var(--red)}
.meter{height:7px;background:#eee3dd;border-radius:99px;margin-top:9px;overflow:hidden}.meter i{display:block;height:100%;width:0;border-radius:99px;background:var(--rose2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.action{border:0;border-radius:13px;padding:10px 13px;background:var(--rose);color:white}.secondary{background:#e7d9d2;color:#5d4d49}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fffaf7;border-radius:20px;padding:8px 11px;color:var(--muted)}.tab.active{background:var(--rose);color:white}
.history{display:none}.history.show{display:block}.day{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;margin:7px 0}
@media(max-width:520px){.result{min-width:82px}.num{width:105px}.score{font-size:36px}}
</style></head><body><div class="app">
<header><h1>Мой день</h1><div class="sub">Мягко. Честно. Без суеты. С любовью к себе.</div></header>
<div class="sticky"><input class="date" id="date" type="date" onchange="loadDay(this.value)"></div>
<div class="summary"><div class="scoreRow"><div class="score" id="score">0%</div><div class="grow"><div class="bar"><div class="fill" id="fill"></div></div><div class="meta" id="meta">0 из 42 пунктов заполнено</div></div></div></div>
<div class="actions"><button class="action" onclick="showHistory()">📊 Статистика</button><button class="action secondary" onclick="newDay()">Сегодня</button><button class="action secondary" onclick="exportAll()">Скачать данные</button></div>
<div class="tabs"><button class="tab active" onclick="scrollTop()">Сегодня</button><button class="tab" onclick="showHistory()">Статистика</button></div>
<div id="tracker"></div><div id="history" class="history"></div>
</div>
<script>
const TOTAL=TOTAL, sections=[["🌅 Утро и энергия", [["Утренние ритуалы", "yn"], ["Работа с энергией", "yn"], ["Уход за собой", "yn"], ["Внешность и красота, мои ощущения", "scale", 10], ["Здоровье, мои ощущения", "scale", 10]]], ["🌿 Тело и забота о себе", [["Движение", "range", 10000, "шагов", 5000, 20000], ["Спорт", "yn"], ["Порядок", "yn"], ["Питание", "scale", 10], ["Кофе", "range", 1, "чашек", 0, 3], ["Хлеб и кулинария", "yn"], ["Вода", "range", 1.5, "л", 0.5, 2], ["Паузы для себя", "range", 30, "минут", 15, 60]]], ["💰 Дело, деньги и развитие", [["Работа над доходом", "text"], ["Инвестиции", "yn"], ["Развитие профессионализма", "yn"], ["Обучение и саморазвитие", "yn"], ["Творчество", "yn"]]], ["💗 Я выбираю себя", [["Отдых и бережность к себе", "yn"], ["Работа со своим эмоциональным состоянием, без суеты, в спокойствии", "yn"], ["Дисциплина и саморганизованность", "yn"], ["Проявленность и мои отношения", "yn"], ["Выбирать себя", "yn"], ["Не соглашаться на меньшее", "yn"], ["Мои обещания себе", "yn"], ["Моё пространство меня наполняет?", "yn"], ["Личная жизнь", "yn"], ["Чувство удовлетворения", "yn"]]], ["🌙 Вечер", [["Вечерние ритуалы", "yn"], ["Сон", "range", 8, "часов", 7, 10]]], ["✨ Рефлексия дня", [["Чудеса дня", "text"], ["Мой главный шаг сегодня", "text"], ["Что у меня получилось", "text"], ["Где я выбрала себя", "text"], ["За что я благодарна", "text"], ["Какое моё внутреннее состояние", "text"], ["Что я сегодня сделала для здоровья", "text"], ["Что я сегодня сделала для внешности, ухода и тела", "text"], ["Что я сегодня сделала для финансового роста", "text"], ["Что я сегодня сделала для внутреннего состояния", "text"], ["Что я сегодня сделала для личной жизни и отношений", "text"], ["Что я хочу сделать завтра", "text"]]]];
let day=document.getElementById('date'), today=new Date().toLocaleDateString('en-CA');
day.value=today; let data={};
function key(si,ii){return 's'+si+'i'+ii}
function db(){return JSON.parse(localStorage.getItem('trackerDays')||'{}')}
function loadDay(d){day.value=d;data=db()[d]||{};render()}
function save(){let all=db();all[day.value]=data;localStorage.setItem('trackerDays',JSON.stringify(all));update()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function setYN(k,v){data[k]=v;save();render()}
function num(k,v,target,type,min,max){data[k]=v===''?'':Number(v);save();updateOne(k,target,type,min,max)}
function pctFor(v,target){return Math.max(0,Math.min(100,(Number(v)/target)*100))}
function status(v,target,min,max){let n=Number(v);if(n<min)return ['ниже минимума','red'];if(n<target)return ['до нормы','gold'];if(n<=max)return ['норма','green'];return ['выше максимума','gold']}
function render(){
 let root=document.getElementById('tracker');root.innerHTML='';
 sections.forEach((sec,si)=>{
  let h=document.createElement('section');h.innerHTML='<h2>'+esc(sec[0])+'</h2>';
  sec[1].forEach((it,ii)=>{
   let name=it[0],type=it[1],target=it[2],unit=it[3],min=it[4],max=it[5],k=key(si,ii),v=data[k]??'',c=document.createElement('div');c.className='card';
   if(type==='yn') c.innerHTML='<div class="row"><div class="grow title">'+esc(name)+'</div><div class="yn"><button class="circle '+(v==='yes'?'active':'')+'" onclick="setYN(\''+k+'\',\'yes\')">Да</button><button class="circle '+(v==='no'?'active':'')+'" onclick="setYN(\''+k+'\',\'no\')">Нет</button></div></div>';
   else if(type==='text') c.innerHTML='<div class="title">'+esc(name)+'</div><textarea placeholder="Напиши здесь…" oninput="data[\''+k+'\']=this.value;save()">'+esc(v)+'</textarea>';
   else if(type==='scale') c.innerHTML='<div class="row"><div class="grow"><div class="title">'+esc(name)+'</div><div class="hint">Оценка от 0 до 10</div></div><input class="num" type="number" min="0" max="10" step="1" value="'+esc(v)+'" oninput="num(\''+k+'\',this.value,10,\'scale\',0,10)"><div class="result" id="r_'+k+'">'+(v!==''?Math.round(Number(v)/10*100)+'%':'')+'</div></div>';
   else {let p=v!==''?pctFor(v,target):0;c.innerHTML='<div class="row"><div class="grow"><div class="title">'+esc(name)+'</div><div class="hint">'+min+' · '+target+' · '+max+' '+unit+' — минимум / норма / максимум</div></div><input class="num" type="number" min="0" step="'+(unit==='л'?'.1':'1')+'" value="'+esc(v)+'" oninput="num(\''+k+'\',this.value,'+target+',\'range\','+min+','+max+')"><div class="result" id="r_'+k+'">'+(v!==''?Math.round(p)+'%':'')+'</div></div><div class="meter"><i id="m_'+k+'" style="width:'+p+'%"></i></div>'}
   h.appendChild(c);
  });root.appendChild(h);
 });update()
}
function updateOne(k,target,type,min,max){let v=data[k],r=document.getElementById('r_'+k),m=document.getElementById('m_'+k);if(v===''){if(r)r.textContent='';return}let p=type==='scale'?Number(v)/10*100:pctFor(v,target);if(type==='scale')r.textContent=Math.round(p)+'%';else{let s=status(v,target,min,max);r.textContent=Math.round(p)+'% · '+s[0];r.className='result '+s[1]}if(m)m.style.width=p+'%';update()}
function update(){let done=0;sections.forEach((s,si)=>s[1].forEach((it,ii)=>{let v=data[key(si,ii)];if(v!==undefined&&v!=='')done++}));let p=Math.round(done/TOTAL*100);document.getElementById('score').textContent=p+'%';document.getElementById('fill').style.width=p+'%';document.getElementById('meta').textContent=done+' из '+TOTAL+' пунктов заполнено'}
function newDay(){loadDay(new Date().toLocaleDateString('en-CA'))}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
function showHistory(){let box=document.getElementById('history');box.classList.toggle('show');if(box.classList.contains('show')){let all=db(),keys=Object.keys(all).sort().reverse();box.innerHTML='<h2>📊 Статистика по дням</h2>'+ (keys.length?keys.map(d=>{let old=data;data=all[d];let done=0;sections.forEach((s,si)=>s[1].forEach((it,ii)=>{if(data[key(si,ii)]!==undefined&&data[key(si,ii)]!=='')done++}));let p=Math.round(done/TOTAL*100);data=old;return '<div class="day"><b>'+d+'</b><div class="meta">'+p+'% · '+done+'/'+TOTAL+' пунктов</div><div class="meter"><i style="width:'+p+'%"></i></div></div>'}).join(''):'<div class="day">Пока нет сохранённых дней.</div>')}}
function exportAll(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db(),null,2)],{type:'application/json'}));a.download='мой-трекер-данные.json';a.click()}
loadDay(today);
</script></body></html>
