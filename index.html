<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#875664">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мой день">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Мой день</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:78px}
:root{--bg:#f7efeb;--card:#fffdfb;--ink:#473b39;--muted:#8c7a75;--rose:#875664;--rose2:#c99aa2;--line:#eadbd5;--green:#719276;--gold:#b08a55;--red:#b66d6d}
body{margin:0;background:linear-gradient(180deg,#fbf6f2,#eee2dc);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:780px;margin:auto;padding:10px 14px 55px}
header{text-align:center;padding:8px 0 12px}
h1{font:500 35px Georgia,serif;color:#704b55;margin:5px}
.tag{font-size:13px;color:var(--muted)}
.sticky{position:sticky;top:0;z-index:20;background:#f7efebee;backdrop-filter:blur(15px);padding:7px 0}
.date{width:100%;padding:11px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--ink);font:inherit}
.hero{background:linear-gradient(135deg,#fffaf7,#f0e0e2);border:1px solid var(--line);border-radius:26px;padding:17px;margin:10px 0;box-shadow:0 8px 28px #5a372d14}
.top,.row{display:flex;align-items:center;gap:10px}.grow{flex:1}
.score{font:500 44px Georgia,serif;color:var(--rose)}
.bar,.meter{background:#e7dcd7;border-radius:99px;overflow:hidden}
.bar{height:10px}.fill,.meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#bd8993,#789579);transition:.25s}
.meta,.hint{font-size:11px;color:var(--muted);margin-top:6px}
.quote{font:italic 17px Georgia,serif;color:#75515b;margin:14px 0 9px}
.journal{display:grid;gap:8px}
textarea,input{font:inherit;background:#fffaf7;border:1px solid var(--line);border-radius:13px;color:var(--ink);outline:none}
textarea{width:100%;min-height:68px;padding:11px;resize:vertical}
.actions,.chips{display:flex;gap:8px;overflow:auto;padding:3px 0 7px}
.btn,.chip{white-space:nowrap;border-radius:14px;padding:10px 13px;text-decoration:none;font:inherit;border:0}
.btn{background:var(--rose);color:#fff}.secondary,.chip{background:#e8dad3;color:#5d4d49}
.chip{border:1px solid var(--line);border-radius:99px;display:block;touch-action:manipulation}
h2{font:500 22px Georgia,serif;color:#704b55;margin:22px 3px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin:8px 0}
.title{font-size:15px;font-weight:650;line-height:1.35}.yn{display:flex;gap:7px}
.circle{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:#faf5f2;color:var(--muted);font-weight:650}
.circle.active{background:var(--rose);border-color:var(--rose);color:#fff}
.num{width:105px;padding:10px}.result{font-size:11px;font-weight:700;text-align:right;min-width:82px}
.green{color:var(--green)}.gold{color:var(--gold)}.red{color:var(--red)}
.meter{height:7px;margin-top:8px}.meter i{background:var(--rose2)}
.back{text-align:center;margin:10px 0 4px}.back a{font-size:12px}
.stats{display:none}.stats.show{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat,.day{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px}
.stat b{font-size:22px;color:var(--rose)}.stat span{font-size:11px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0}
@media(max-width:520px){.score{font-size:38px}.num{width:96px}}
</style>
</head>
<body>
<div class="app" id="top">
<header><h1>Мой день</h1><div class="tag">Личный дневник состояния · мягко · честно · с любовью к себе</div></header>
<div class="sticky"><input class="date" id="date" type="date"></div>
<section class="hero">
<div class="top"><div class="score" id="score">0%</div><div class="grow"><div class="bar"><div class="fill" id="fill"></div></div><div class="meta" id="meta"></div></div></div>
<div class="quote" id="quote">Начни с одного маленького шага. 💗</div>
<div class="journal">
<textarea id="j1" placeholder="✨ Мой главный шаг сегодня"></textarea>
<textarea id="j2" placeholder="💗 Где я выбрала себя"></textarea>
<textarea id="j3" placeholder="🙏 За что я благодарна"></textarea>
<textarea id="j4" placeholder="🌸 Какое моё внутреннее состояние"></textarea>
</div></section>
<div class="actions">
<button class="btn" id="todayBtn">🌷 Сегодня</button>
<button class="btn secondary" id="statsBtn">📊 Статистика</button>
<button class="btn secondary" id="exportBtn">💾 Экспорт</button>
<button class="btn secondary" id="clearBtn">Очистить</button>
</div>
<nav class="chips" aria-label="Разделы">
<a class="chip" href="#sec0">🌅 Утро и энергия</a><a class="chip" href="#sec1">🌿 Тело и забота о себе</a><a class="chip" href="#sec2">💰 Дело, деньги и развитие</a><a class="chip" href="#sec3">💗 Я выбираю себя</a><a class="chip" href="#sec4">🌙 Вечер</a><a class="chip" href="#sec5">✨ Рефлексия дня</a>
</nav>
<div id="tracker"></div>
<div id="stats" class="stats"></div>
<footer>Данные сохраняются на этом устройстве. Экспорт используй для резервной копии.</footer>
</div>
<script>
const SECTIONS=[["🌅 Утро и энергия", [["Утренние ритуалы", "yn"], ["Работа с энергией", "yn"], ["Уход за собой", "yn"], ["Внешность и красота, мои ощущения", "scale"], ["Здоровье, мои ощущения", "scale"]]], ["🌿 Тело и забота о себе", [["Движение", "range", 10000, "шагов", 5000, 20000], ["Спорт", "yn"], ["Порядок", "yn"], ["Питание", "scale"], ["Кофе", "range", 1, "чашек", 0, 3], ["Хлеб и кулинария", "yn"], ["Вода", "range", 1.5, "л", 0.5, 2], ["Паузы для себя", "range", 30, "минут", 15, 60]]], ["💰 Дело, деньги и развитие", [["Работа над доходом", "text"], ["Инвестиции", "yn"], ["Развитие профессионализма", "yn"], ["Обучение и саморазвитие", "yn"], ["Творчество", "yn"]]], ["💗 Я выбираю себя", [["Отдых и бережность к себе", "yn"], ["Работа со своим эмоциональным состоянием, без суеты, в спокойствии", "yn"], ["Дисциплина и саморганизованность", "yn"], ["Проявленность и мои отношения", "yn"], ["Выбирать себя", "yn"], ["Не соглашаться на меньшее", "yn"], ["Мои обещания себе", "yn"], ["Моё пространство меня наполняет?", "yn"], ["Личная жизнь", "yn"], ["Чувство удовлетворения", "yn"]]], ["🌙 Вечер", [["Вечерние ритуалы", "yn"], ["Сон", "range", 8, "часов", 7, 10]]], ["✨ Рефлексия дня", [["Чудеса дня", "text"], ["Мой главный шаг сегодня", "text"], ["Что у меня получилось", "text"], ["Где я выбрала себя", "text"], ["За что я благодарна", "text"], ["Какое моё внутреннее состояние", "text"], ["Что я сегодня сделала для здоровья", "text"], ["Что я сегодня сделала для внешности, ухода и тела", "text"], ["Что я сегодня сделала для финансового роста", "text"], ["Что я сегодня сделала для внутреннего состояния", "text"], ["Что я сегодня сделала для личной жизни и отношений", "text"], ["Что я хочу сделать завтра", "text"]]]];
const TOTAL=42;
const STORE='my_day_tracker_v3_data';
let data={};
const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleDateString('en-CA');
const K=(s,i)=>'s'+s+'i'+i;

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]);}
function all(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return{}}}
function save(){const a=all();a[$('date').value]=data;localStorage.setItem(STORE,JSON.stringify(a));summary();}
function load(d){$('date').value=d;data=all()[d]||{};render();journal();summary();}
function yn(k,v){data[k]=v;save();render();}
function pct(v,t){return Math.max(0,Math.min(100,Number(v)/Number(t)*100));}
function num(k,v,t,type,min,max){data[k]=v===''?'':Number(v);save();metric(k,t,type,min,max);}

function metric(k,t,type,min,max){
 const v=data[k],r=$('r'+k),m=$('m'+k); if(v==='')return;
 const p=type==='scale'?Math.min(100,Number(v)*10):pct(v,t);
 if(type==='scale'){r.textContent=Math.round(p)+'%';r.className='result '+(p>=70?'green':p>=40?'gold':'red');}
 else{const n=Number(v);const s=n<min?['ниже минимума','red']:n<t?['до нормы','gold']:n<=max?['норма','green']:['выше максимума','gold'];r.textContent=Math.round(p)+'% · '+s[0];r.className='result '+s[1];}
 m.style.width=p+'%';summary();
}

function render(){
 const root=$('tracker');root.innerHTML='';
 SECTIONS.forEach((sec,si)=>{
  const section=document.createElement('section');section.id='sec'+si;
  section.innerHTML='<h2>'+esc(sec[0])+'</h2>';
  sec[1].forEach((it,ii)=>{
   const n=it[0],type=it[1],k=K(si,ii),v=data[k]??'',c=document.createElement('div');c.className='card';
   if(type==='yn'){
    c.innerHTML='<div class="row"><div class="grow title">'+esc(n)+'</div><div class="yn"><button class="circle '+(v==='yes'?'active':'')+'" type="button">Да</button><button class="circle '+(v==='no'?'active':'')+'" type="button">Нет</button></div></div>';
    const b=c.querySelectorAll('.circle');b[0].onclick=()=>yn(k,'yes');b[1].onclick=()=>yn(k,'no');
   }else if(type==='text'){
    c.innerHTML='<div class="title">'+esc(n)+'</div><textarea placeholder="Напиши здесь…">'+esc(v)+'</textarea>';
    c.querySelector('textarea').oninput=e=>{data[k]=e.target.value;save();};
   }else if(type==='scale'){
    const p=v!==''?Math.min(100,Number(v)*10):0;
    c.innerHTML='<div class="row"><div class="grow title">'+esc(n)+'</div><input class="num" type="number" min="0" max="10" value="'+esc(v)+'"><div class="result" id="r'+k+'">'+(v!==''?Math.round(p)+'%':'')+'</div></div><div class="meter"><i id="m'+k+'" style="width:'+p+'%"></i></div>';
    c.querySelector('input').oninput=e=>num(k,e.target.value,10,'scale',0,10);
   }else{
    const t=it[2],u=it[3],mi=it[4],ma=it[5],p=v!==''?pct(v,t):0;
    c.innerHTML='<div class="row"><div class="grow"><div class="title">'+esc(n)+'</div><div class="hint">Минимум '+mi+' · Норма '+t+' · Максимум '+ma+' '+u+'</div></div><input class="num" type="number" min="0" step="'+(u==='л'?'.1':'1')+'" value="'+esc(v)+'"><div class="result" id="r'+k+'">'+(v!==''?Math.round(p)+'%':'')+'</div></div><div class="meter"><i id="m'+k+'" style="width:'+p+'%"></i></div>';
    c.querySelector('input').oninput=e=>num(k,e.target.value,t,'range',mi,ma);
   }
   section.appendChild(c);
  });
  const back=document.createElement('div');back.className='back';back.innerHTML='<a class="chip" href="#top">↑ К разделам</a>';section.appendChild(back);
  root.appendChild(section);
 });
}

function summary(){
 let n=0;SECTIONS.forEach((s,si)=>s[1].forEach((it,ii)=>{if(data[K(si,ii)]!==undefined&&data[K(si,ii)]!=='')n++;}));
 const p=Math.round(n/TOTAL*100);$('score').textContent=p+'%';$('fill').style.width=p+'%';$('meta').textContent=n+' из '+TOTAL+' пунктов заполнено';
 $('quote').textContent=p>=80?'Ты сегодня выбираешь себя. ✨':p>=50?'Ты уже сделала важную часть для себя. 🌷':'Начни с одного маленького шага. 💗';
}

function journal(){
 ['j1','j2','j3','j4'].forEach((id,i)=>{const el=$(id);el.value=data['journal'+i]||'';el.oninput=()=>{data['journal'+i]=el.value;save();};});
}
function clearDay(){if(confirm('Очистить все записи за этот день?')){data={};save();render();journal();}}
function stats(){
 const a=all(),days=Object.keys(a).sort().reverse(),vals=days.map(d=>{let n=0;SECTIONS.forEach((s,si)=>s[1].forEach((it,ii)=>{if(a[d][K(si,ii)]!==undefined&&a[d][K(si,ii)]!=='')n++;}));return Math.round(n/TOTAL*100);});
 const avg=vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/vals.length):0,best=vals.length?Math.max(...vals):0;
 let o='<h2>📊 Статистика</h2><div class="grid"><div class="stat"><b>'+avg+'%</b><br><span>средний результат</span></div><div class="stat"><b>'+best+'%</b><br><span>лучший день</span></div><div class="stat"><b>'+days.length+'</b><br><span>дней сохранено</span></div></div><h2>📅 По дням</h2>';
 if(!days.length)o+='<div class="day">Пока нет сохранённых дней.</div>';
 days.forEach((d,i)=>o+='<div class="day"><b>'+d+'</b><div class="hint">'+vals[i]+'%</div><div class="meter"><i style="width:'+vals[i]+'%"></i></div></div>');
 $('stats').innerHTML=o;$('stats').classList.toggle('show');
}
function exportData(){const b=new Blob([JSON.stringify(all(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='moi-den-dannye.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}

document.addEventListener('DOMContentLoaded',()=>{
 $('date').onchange=e=>load(e.target.value);
 $('todayBtn').onclick=()=>load(today());
 $('statsBtn').onclick=stats;
 $('exportBtn').onclick=exportData;
 $('clearBtn').onclick=clearDay;
 load(today());
 if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
});
</script>
</body></html>
